spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resigest}
    username: ${DB_USERNAME:resigest}
    password: ${DB_PASSWORD:resigest}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: resigest-dev-secret-key-para-desarrollo-cambiar-en-produccion-2026
    expiracion-horas: 8
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  pasarela: simulada
  wompi:
    url: https://sandbox.wompi.co/v1
    llave-publica: ${WOMPI_PUBLIC_KEY:}
    llave-privada: ${WOMPI_PRIVATE_KEY:}
    correo-cliente: cliente@resigest.com
  credenciales:
    clave: ${RESIGEST_CLAVE_CREDENCIALES:resigest-dev-clave-credenciales-cambiar-en-produccion}
