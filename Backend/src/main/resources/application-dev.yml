spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resigest
    username: resigest
    password: resigest
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: resigest-dev-secret-key-para-desarrollo-cambiar-en-produccion-2026
    expiracion-horas: 8
  cors:
    origins: http://localhost:5173
  webhook:
    secret: resigest-dev-webhook-secret
  pasarela: simulada
  wompi:
    url: https://sandbox.wompi.co/v1
    llave-publica: ${WOMPI_PUBLIC_KEY:}
    llave-privada: ${WOMPI_PRIVATE_KEY:}
    correo-cliente: cliente@resigest.com
