# Perfil de producción: todo sale de variables de entorno (ver Documentation/DESPLIEGUE.md).
# Se activa con SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # El plan gratuito de Supabase limita las conexiones simultáneas
      maximum-pool-size: ${DB_MAX_CONEXIONES:5}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

server:
  # Render, Railway y similares indican el puerto en PORT
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRETO}
    expiracion-horas: ${JWT_EXPIRACION_HORAS:8}
  cors:
    origenes: ${CORS_ORIGENES}
  credenciales:
    clave: ${RESIGEST_CLAVE_CREDENCIALES}
  # Pago en línea con PayU. Por defecto, el sandbox con las credenciales públicas de prueba
  # de la documentación de PayU (no se mueve dinero real).
  payu:
    url-checkout: ${PAYU_URL_CHECKOUT:https://sandbox.checkout.payulatam.com/ppp-web-gateway-payu/}
    url-consultas: ${PAYU_URL_CONSULTAS:https://sandbox.api.payulatam.com/reports-api/4.0/service.cgi}
    merchant-id: ${PAYU_MERCHANT_ID:508029}
    account-id: ${PAYU_ACCOUNT_ID:512321}
    api-login: ${PAYU_API_LOGIN:pRRXKOl8ikMmt9u}
    api-key: ${PAYU_API_KEY:4Vj8eK4rloUd272L48hsrarnUA}
    pruebas: ${PAYU_PRUEBAS:true}
    url-confirmacion: ${PAYU_URL_CONFIRMACION:}
