spring:
  application:
    name: ResiGest
  # Variables locales (BD, secretos) en Backend/.env, que no se sube al repo. Ver .env.example.
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    hikari:
      # Supabase gratis admite 15 conexiones en total, compartidas por el backend local y el de
      # Render (que al desplegar tiene dos copias vivas un momento). Producción sube el máximo a 5.
      maximum-pool-size: ${DB_MAX_CONEXIONES:3}
      minimum-idle: 1
      idle-timeout: 120000
      data-source-properties:
        # @Transactional(readOnly = true) no envía SET SESSION ... READ ONLY antes y después de cada
        # lectura: con la BD remota eran dos viajes extra por consulta
        readOnlyMode: ignore
  jpa:
    properties:
      hibernate:
        # Las relaciones LAZY se cargan en grupos (un IN de hasta 50 ids) y no una consulta por fila.
        # Con la BD remota cada consulta cuesta ~100 ms, así que evita listados lentos (N+1).
        default_batch_fetch_size: 50
